<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background-color: #f8f9fa; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <!-- Background Grid lines (Subtle Architectural feel) -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa8407" />
      <stop offset="100%" stop-color="#d96b00" />
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Main Dashboard / Plan Window Card -->
  <rect x="80" y="60" width="640" height="380" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.05))" />
  
  <!-- Window Header Bar -->
  <path d="M 80 72 C 80 65.37 85.37 60 92 60 L 708 60 C 714.63 60 720 65.37 720 72 L 720 100 L 80 100 Z" fill="#0f172a" />
  <circle cx="110" cy="80" r="5" fill="#ef4444" />
  <circle cx="126" cy="80" r="5" fill="#f59e0b" />
  <circle cx="142" cy="80" r="5" fill="#10b981" />
  <text x="165" y="84" fill="#94a3b8" font-size="12" font-weight="500">BidConnectors — Columbus, OH Procurement Stream</text>

  <!-- Content UI Mockup: Spreadsheets vs Automated Stream -->
  <!-- Left Side: Old Way (Spreadsheets) -->
  <rect x="110" y="130" width="260" height="280" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="130" y="158" fill="#64748b" font-size="12" font-weight="700">OLD WAY: MANUAL TRACKING</text>
  
  <!-- Messy Tabs / Spreadsheets visual -->
  <rect x="130" y="175" width="220" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <rect x="138" y="183" width="80" height="8" rx="2" fill="#94a3b8" />
  <rect x="290" y="183" width="50" height="8" rx="2" fill="#f87171" />
  
  <rect x="130" y="210" width="220" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <rect x="138" y="218" width="110" height="8" rx="2" fill="#94a3b8" />
  <rect x="290" y="218" width="50" height="8" rx="2" fill="#f87171" />

  <rect x="130" y="245" width="220" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <rect x="138" y="253" width="90" height="8" rx="2" fill="#94a3b8" />
  <rect x="290" y="253" width="50" height="8" rx="2" fill="#fbbf24" />

  <text x="130" y="305" fill="#94a3b8" font-size="11" font-weight="500">40+ Tabs Open</text>
  <text x="130" y="325" fill="#94a3b8" font-size="11" font-weight="500">6.2 Hours/Wk Wasted</text>

  <!-- Right Side: New Way (Bid Connectors Filtered Feed) -->
  <rect x="400" y="130" width="290" height="280" rx="8" fill="#ffffff" stroke="#fa8407" stroke-width="2" />
  <text x="420" y="158" fill="#fa8407" font-size="12" font-weight="700">BID CONNECTORS FEED</text>

  <!-- Qualified Bid Item 1 -->
  <rect x="420" y="175" width="250" height="60" rx="6" fill="#fff7ed" stroke="#ffedd5" stroke-width="1" />
  <rect x="432" y="188" width="120" height="10" rx="2" fill="#0f172a" />
  <rect x="432" y="205" width="70" height="8" rx="2" fill="#fa8407" />
  <rect x="610" y="188" width="50" height="20" rx="10" fill="#22c55e" />
  <text x="618" y="202" fill="#ffffff" font-size="10" font-weight="700">MATCH</text>

  <!-- Qualified Bid Item 2 -->
  <rect x="420" y="245" width="250" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <rect x="432" y="258" width="140" height="10" rx="2" fill="#0f172a" />
  <rect x="432" y="275" width="85" height="8" rx="2" fill="#64748b" />
  <rect x="610" y="258" width="50" height="20" rx="10" fill="#22c55e" />
  <text x="618" y="272" fill="#ffffff" font-size="10" font-weight="700">MATCH</text>

  <!-- Stat Badge at Bottom Right -->
  <rect x="420" y="320" width="250" height="65" rx="6" fill="#0f172a" />
  <text x="435" y="345" fill="#ffffff" font-size="20" font-weight="800">112 Sources</text>
  <text x="435" y="362" fill="#94a3b8" font-size="11">Checked automatically every morning</text>
</svg>
